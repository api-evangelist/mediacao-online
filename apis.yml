name: Mediacao Online
description: MOL (Mediacao Online) is Brazil's first online dispute resolution (ODR)
  platform, founded in 2014 in Sao Paulo. It is a 100% digital, automated platform
  for negotiation, conciliation, and mediation that lets individuals, companies, and
  institutions resolve conflicts extrajudicially without going to court. The CNJ-compliant
  platform covers the full flow, from capturing cases in the courts, building agreement
  policies, sanitizing and enriching data, through to agreement approval and payment.
  MOL has facilitated tens of thousands of agreements and counts Magazine Luiza, Itau,
  and Caixa Economica among its clients. It is backed by 500 Global, Wayra, Canary,
  and Redpoint eventures. MOL exposes no public developer API or documentation surface.
